<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nomophobia Test</title>
    <style>
        :root {
            --bg: #F7F9FC;
            --text: #1C1C1E;
            --green: #34C759;
            --yellow: #FFCC00;
            --red: #FF3B30;
            --white: #FFFFFF;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            /* 兼容现代手机的动态高度，解决浏览器地址栏遮挡问题 */
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            transition: background-color 0.5s ease;
        }

        #app {
            width: 100%;
            max-width: 440px;
            height: 100%;
            max-height: 850px;
            position: relative;
            display: flex;
            flex-direction: column;
            padding: 15px;
        }

        /* 顶部进度条 */
        .progress-container {
            width: 100%;
            height: 6px;
            background: #E5E5EA;
            border-radius: 10px;
            margin-bottom: 10px;
            overflow: hidden;
            display: none;
            flex-shrink: 0;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background-color: var(--green);
            transition: width 0.5s ease, background-color 0.5s ease;
        }

        #card-container {
            flex-grow: 1;
            position: relative;
            width: 100%;
            height: 100%;
        }

        /* Y2K 卡片 */
        .card {
            background: var(--white);
            border-radius: 24px;
            padding: 24px 20px;
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.06);
            display: flex;
            flex-direction: column;
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 5px;
            transition: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
            border: 2px solid transparent;
            /* 支持内容过多时滚动，并隐藏滚动条 */
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none; /* Firefox */
        }
        
        .card::-webkit-scrollbar {
            display: none; /* Chrome/Safari */
        }

        /* 滑动卡片动画 */
        .slide-in {
            animation: slideInRight 0.45s cubic-bezier(0.25, 0.8, 0.25, 1) forwards;
        }

        .slide-out {
            animation: slideOutLeft 0.45s cubic-bezier(0.25, 0.8, 0.25, 1) forwards;
        }

        @keyframes slideInRight {
            from { transform: translateX(120%) rotate(4deg); opacity: 0; }
            to { transform: translateX(0) rotate(0); opacity: 1; }
        }

        @keyframes slideOutLeft {
            from { transform: translateX(0) rotate(0); opacity: 1; }
            to { transform: translateX(-120%) rotate(-4deg); opacity: 0; }
        }

        /* 丧尸红暴恐警报动画 */
        @keyframes emergency-flash {
            0% { box-shadow: 0 16px 40px rgba(255, 59, 48, 0.15); border-color: rgba(255, 59, 48, 0.3); }
            50% { box-shadow: 0 16px 40px rgba(255, 59, 48, 0.4); border-color: rgba(255, 59, 48, 0.8); }
            100% { box-shadow: 0 16px 40px rgba(255, 59, 48, 0.15); border-color: rgba(255, 59, 48, 0.3); }
        }
        .flash-card {
            animation: emergency-flash 1.5s infinite ease-in-out !important;
        }

        /* 标题与 Emoji 层级 */
        .stage-title {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #8E8E93;
            margin-bottom: 5px;
            font-weight: 700;
            text-align: center;
            flex-shrink: 0;
        }

        .giant-emoji {
            font-size: 4rem;
            text-align: center;
            margin: 5px 0 10px 0;
            text-shadow: 0 8px 16px rgba(0,0,0,0.08);
            animation: float 3s ease-in-out infinite;
            flex-shrink: 0;
        }

        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-8px); }
            100% { transform: translateY(0px); }
        }

        .question-title {
            font-size: 1.45rem;
            font-weight: 800;
            margin: 0 0 8px 0;
            line-height: 1.25;
            text-align: center;
            flex-shrink: 0;
        }

        .question-desc {
            font-size: 1rem;
            color: #636366;
            margin: 0 0 20px 0;
            line-height: 1.45;
            font-weight: 500;
            text-align: center;
            flex-shrink: 0;
        }

        /* Q弹选项设计 */
        .options {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: auto;
            flex-shrink: 0;
        }

        .btn {
            background: #F2F2F7;
            border: 2px solid transparent;
            border-radius: 18px;
            padding: 14px 16px;
            font-size: 0.95rem;
            color: var(--text);
            font-weight: 600;
            cursor: pointer;
            text-align: left;
            transition: all 0.15s cubic-bezier(0.175, 0.885, 0.32, 1.225);
            line-height: 1.35;
            width: 100%;
        }

        .btn:hover {
            background: #E5E5EA;
            transform: translateY(-2px);
        }

        .btn:active {
            transform: scale(0.96);
            background: #D1D1D6;
        }

        /* 欢迎页与结果页 */
        .center-text { text-align: center; }
        .start-btn { 
            background: var(--text); 
            color: var(--white); 
            text-align: center; 
            font-size: 1.15rem;
            padding: 16px;
            justify-content: center;
            margin-top: 20px;
        }
        .start-btn:hover { background: #000; color: #FFF;}
        
        .result-box {
            background: rgba(255, 255, 255, 0.6);
            padding: 16px;
            border-radius: 16px;
            margin: 15px 0;
            border: 1px solid currentColor;
            flex-shrink: 0;
        }
        
        .dependency-level {
            font-weight: 800;
            text-transform: uppercase;
            font-size: 0.9rem;
            letter-spacing: 0.5px;
            margin-bottom: 5px;
            opacity: 0.8;
        }

        .snarky-copy { 
            font-style: italic; 
            font-weight: 600; 
            font-size: 1rem; 
            line-height: 1.45;
        }
        
        .presenter-note {
            background: rgba(255, 255, 255, 0.4);
            border: 1.5px dashed currentColor;
            padding: 12px 15px;
            border-radius: 12px;
            font-size: 0.85rem;
            margin-top: 5px;
            margin-bottom: 15px;
            font-weight: 600;
            line-height: 1.4;
            flex-shrink: 0;
        }

        /* === 手机端小屏幕终极适配 (高度小于 750px 或宽度小于 400px 时自动压缩) === */
        @media (max-height: 750px), (max-width: 400px) {
            .card { padding: 18px 15px; }
            .giant-emoji { font-size: 3rem; margin: 0 0 10px 0; }
            .question-title { font-size: 1.25rem; margin: 0 0 5px 0;}
            .question-desc { font-size: 0.9rem; margin: 0 0 15px 0; line-height: 1.3;}
            .btn { padding: 12px 14px; font-size: 0.85rem; border-radius: 14px; }
            .options { gap: 8px; }
            .stage-title { font-size: 0.75rem; }
            .start-btn { padding: 14px; font-size: 1rem; }
        }

    </style>
</head>
<body>

    <div id="app">
        <div class="progress-container" id="progress-container">
            <div class="progress-bar" id="progress-bar"></div>
        </div>
        <div id="card-container"></div>
    </div>

    <script>
        const questions = [
            {
                stage: "Stage 1: The Tool",
                emoji: "⏰",
                title: "Morning Alarm Rings!",
                desc: "What is your immediate move?",
                opts: [
                    { key: 'A', text: "A. Turn it off, stretch, and get up immediately. 🌅" },
                    { key: 'B', text: "B. Turn it off and sleep for another 5 minutes. 😴" },
                    { key: 'C', text: "C. Check WeChat messages with one eye open. 👁️" },
                    { key: 'D', text: "D. Scroll short videos for 30 minutes. My bed is a trap. 🛏️" }
                ],
                color: "var(--green)"
            },
            {
                stage: "Stage 1: The Tool",
                emoji: "🚽",
                title: "Time for the Toilet! 🚽",
                desc: "Your phone is completely dead. What do you do in the bathroom?",
                opts: [
                    { key: 'A', text: "A. Just do my business. It only takes 2 minutes anyway. ⏱️" },
                    { key: 'B', text: "B. Stare at the wall and think about my future. 🧘‍♂️" },
                    { key: 'C', text: "C. Read the shampoo bottle instructions very carefully. 🧴" },
                    { key: 'D', text: "D. Refuse to go. I will hold it until my phone is charged! ⚡" }
                ],
                color: "var(--green)"
            },
            {
                stage: "Stage 2: The Habit",
                emoji: "🍽️",
                title: "Dinner Time! 🍽️",
                desc: "Your delicious food is ready, but you haven't found a video to watch yet.",
                opts: [
                    { key: 'A', text: "A. Focus on the food. It tastes great. 🥗" },
                    { key: 'B', text: "B. Chat with my family or friends at the table. 🗣️" },
                    { key: 'C', text: "C. Eat with a video, but any random video is fine. 📺" },
                    { key: 'D', text: "D. Let the food freeze. I MUST find the perfect video first! 🧊" }
                ],
                color: "var(--yellow)"
            },
            {
                stage: "Stage 2: The Habit",
                emoji: "🪫",
                title: "The 5% Panic 🪫",
                desc: "Your battery indicator turns red. You are outside.",
                opts: [
                    { key: 'A', text: "A. Cool. I will survive. 🧊" },
                    { key: 'B', text: "B. Turn on 'Low Power Mode' and put it in my pocket. 🔋" },
                    { key: 'C', text: "C. Ask everyone loudly: 'Do you have a power bank?!' 🆘" },
                    { key: 'D', text: "D. Become a Wall Hugger. I live next to the socket now. 🔌" }
                ],
                color: "var(--yellow)"
            },
            {
                stage: "Stage 3: The Mind",
                emoji: "😱",
                title: "The Lost Phone 😱",
                desc: "You are already on the bus, but you realize you left your phone at home.",
                opts: [
                    { key: 'A', text: "A. 'Free at last!' Let's enjoy the real world today. 🕊️" },
                    { key: 'B', text: "B. A bit worried, but I can survive for a day. 🤔" },
                    { key: 'C', text: "C. Feel completely empty. Where should I put my hands? 👐" },
                    { key: 'D', text: "D. 'I lost my soul.' Run off the bus and go back home NOW! 🏃‍♂️💨" }
                ],
                color: "var(--red)"
            }
        ];

        const results = {
            'A': {
                title: "The Time Traveler",
                emoji: "🦕",
                level: "Dependency Level: 0%",
                copy: "Wait, are you from 1999? Do you even know what Wi-Fi is? You are too healthy. You have a real life, and honestly... it makes the rest of us look bad. Respect!",
                theme: { bg: '#EAFBEF', text: '#14532D', border: '#86EFAC', accent: '#22C55E' }
            },
            'B': {
                title: "The True Master",
                emoji: "😎",
                level: "Dependency Level: 20%",
                copy: "Congratulations. You use your phone, but your phone doesn't use you. You only check it when you need to. You are the master of your own time.",
                theme: { bg: '#EFF6FF', text: '#1E3A8A', border: '#93C5FD', accent: '#3B82F6' }
            },
            'C': {
                title: "The Anxious Scroller",
                emoji: "👀",
                level: "Dependency Level: 70%",
                copy: "You are standing on the edge of danger. You unlock your screen every 5 minutes just to check... nothing. Put the phone down and go talk to a real human.",
                theme: { bg: '#FFFDF0', text: '#7A5B00', border: '#FCD34D', accent: '#F59E0B' }
            },
            'D': {
                title: "The Digital Zombie",
                emoji: "🧟‍♂️",
                level: "Dependency Level: 100%",
                copy: "Emergency! Your phone is your new brain. If the battery dies, you die. You are officially suffering from Nomophobia. You need a doctor, or at least a power bank.",
                theme: { bg: '#FFF5F5', text: '#7F1D1D', border: '#FCA5A5', accent: '#EF4444', customClass: 'flash-card' }
            },
            'MIXED': {
                title: "The Pretender",
                emoji: "🤡",
                level: "Dependency Level: ???",
                copy: "You picked A sometimes to look cool, but we all know you sleep with your phone under your pillow. Stop lying to yourself! You love your screen.",
                theme: { bg: '#FAF5FF', text: '#4C1D95', border: '#C4B5FD', accent: '#8B5CF6' }
            }
        };

        let currentQ = -1;
        let userChoices = [];
        const container = document.getElementById('card-container');
        const progressBar = document.getElementById('progress-bar');
        const progressContainer = document.getElementById('progress-container');

        // 为了手机端用户体验，添加轻微震动反馈
        function playFeedback() {
            if (navigator.vibrate) { navigator.vibrate(40); }
        }

        function renderStart() {
            container.innerHTML = `
                <div class="card slide-in center-text" style="justify-content: center;">
                    <div class="giant-emoji">📱</div>
                    <h1 class="question-title" style="font-size: 2.1rem;">Who is the Boss?</h1>
                    <p class="question-desc" style="margin-bottom:10px;">Are you the master of your phone, or is your phone the master of you?<br><br>Let's find out.</p>
                    <button class="btn start-btn" onclick="playFeedback(); nextQuestion()">
                        Start Test 🚀
                    </button>
                </div>
            `;
        }

        function nextQuestion(choice) {
            if (choice) {
                userChoices.push(choice);
                playFeedback();
            }

            const currentCard = container.querySelector('.card');
            if (currentCard) {
                currentCard.classList.remove('slide-in');
                currentCard.classList.add('slide-out');
            }

            setTimeout(() => {
                currentQ++;
                if (currentQ < questions.length) {
                    renderQuestion();
                } else {
                    renderResult();
                }
            }, 300);
        }

        function renderQuestion() {
            const q = questions[currentQ];
            progressContainer.style.display = 'block';
            progressBar.style.width = `${((currentQ + 1) / questions.length) * 100}%`;
            progressBar.style.backgroundColor = q.color;

            let optionsHTML = '';
            q.opts.forEach(opt => {
                optionsHTML += `
                    <button class="btn" onclick="nextQuestion('${opt.key}')">
                        ${opt.text}
                    </button>
                `;
            });

            container.innerHTML = `
                <div class="card slide-in">
                    <div style="flex-grow: 1; display: flex; flex-direction: column; justify-content: center;">
                        <div class="stage-title" style="color: ${q.color}">${q.stage}</div>
                        <div class="giant-emoji">${q.emoji}</div>
                        <h2 class="question-title">${q.title}</h2>
                        <p class="question-desc">${q.desc}</p>
                    </div>
                    <div class="options">
                        ${optionsHTML}
                    </div>
                </div>
            `;
            // 滚动到顶部以防手机端内容溢出时停留在底部
            container.querySelector('.card').scrollTop = 0;
        }

        function calculateResultKey(choices) {
            const counts = { 'A': 0, 'B': 0, 'C': 0, 'D': 0 };
            choices.forEach(c => counts[c] = (counts[c] || 0) + 1);

            let maxVal = 0;
            let maxKeys = [];
            for (const key in counts) {
                if (counts[key] > maxVal) {
                    maxVal = counts[key];
                    maxKeys = [key];
                } else if (counts[key] === maxVal) {
                    maxKeys.push(key);
                }
            }

            if (maxVal >= 3 && maxKeys.length === 1) {
                return maxKeys[0];
            } else {
                return 'MIXED';
            }
        }

        function renderResult() {
            progressContainer.style.display = 'none';
            const resultKey = calculateResultKey(userChoices);
            const res = results[resultKey];
            
            document.body.style.backgroundColor = res.theme.bg;

            let presenterNote = "";
            if (resultKey === 'D') {
                presenterNote = `
                    <div class="presenter-note">
                        🎤 <b>Presenter Transition:</b><br>
                        "Look at this. Many of us are laughing, but we are actually these Digital Zombies. We think phones are our tools, but honestly... are we the tools of our phones? Let's talk about Nomophobia..."
                    </div>
                `;
            } else if (resultKey === 'MIXED') {
                presenterNote = `
                    <div class="presenter-note">
                        🎤 <b>Presenter Transition:</b><br>
                        "We try to hide our addiction, acting like we can control it. But deep down, are we pretending? Let's face the reality and talk about Nomophobia..."
                    </div>
                `;
            }

            container.innerHTML = `
                <div class="card slide-in ${res.theme.customClass || ''}" 
                     style="background-color: ${res.theme.bg}; 
                            border: 2px solid ${res.theme.border}; 
                            color: ${res.theme.text};">
                    
                    <div style="flex-grow: 1; display: flex; flex-direction: column; justify-content: center;">
                        <div class="stage-title" style="color: ${res.theme.text}; opacity: 0.7;">Your Profile</div>
                        <div class="giant-emoji">${res.emoji}</div>
                        <h2 class="question-title" style="font-size: 1.8rem; margin-bottom: 2px;">${res.title}</h2>
                        <div class="dependency-level center-text" style="color: ${res.theme.accent};">${res.level}</div>
                        
                        <div class="result-box" style="color: ${res.theme.text};">
                            <div class="snarky-copy">"${res.copy}"</div>
                        </div>
                        
                        ${presenterNote}
                    </div>

                    <div style="margin-top:auto;">
                        <button class="btn start-btn" 
                                style="width:100%; margin-top: 5px; background-color: ${res.theme.text}; color: ${res.theme.bg};" 
                                onclick="playFeedback(); resetQuiz()">
                            Test Again 🔄
                        </button>
                    </div>
                </div>
            `;
            container.querySelector('.card').scrollTop = 0;
        }

        function resetQuiz() {
            currentQ = -1;
            userChoices = [];
            document.body.style.backgroundColor = "var(--bg)";
            renderStart();
        }

        renderStart();

    </script>
</body>
</html>
